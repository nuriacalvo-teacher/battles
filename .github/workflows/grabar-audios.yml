# Graba los audios de los ejercicios de Listening y los sube al repositorio.
#
# No hace falta instalar nada ni abrir el terminal: se lanza desde la pestaña
# "Actions" de GitHub, con el boton "Run workflow".
#
# Tarda entre 20 y 40 minutos (son 60 audios). Se puede cerrar la pagina
# mientras tanto: sigue corriendo en los servidores de GitHub.

name: Grabar las palabras del juego

on:
  workflow_dispatch:
    inputs:
      muestra:
        description: 'Solo una muestra corta con la voz elegida'
        type: boolean
        required: false
        default: false
      comparativa:
        description: 'Solo una comparativa con TODAS las voces britanicas, para elegir'
        type: boolean
        required: false
        default: false
      only:
        description: 'Solo estas palabras (opcional). Ej: ankle elbow wrist'
        required: false
        default: ''
      force:
        description: 'Regrabar aunque la palabra ya exista'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: grabar-audios
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar edge-tts
        run: python -m pip install --upgrade pip edge-tts

      - name: Grabar una muestra de la voz elegida
        if: ${{ inputs.muestra && !inputs.comparativa }}
        run: python3 tools/build_words.py --demo

      - name: Grabar la comparativa de todas las voces
        if: ${{ inputs.comparativa }}
        run: python3 tools/build_words.py --audition

      - name: Dejar el audio listo para descargar
        if: ${{ inputs.muestra || inputs.comparativa }}
        uses: actions/upload-artifact@v4
        with:
          name: voces-para-escuchar
          path: |
            audio/muestra-voces.mp3
            audio/comparativa-voces.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Grabar las palabras
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${ONLY}" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--only ${ONLY})
          fi
          if [ "${FORCE}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 tools/build_words.py "${ARGS[@]}"

      - name: Subir las palabras al repositorio
        if: ${{ !inputs.muestra && !inputs.comparativa }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          if git diff --staged --quiet; then
            echo 'No hay palabras nuevas que subir.'
            exit 0
          fi
          git commit -m 'Palabras del juego grabadas automaticamente'
          git push

      - name: Resumen
        if: ${{ always() && !inputs.muestra && !inputs.comparativa }}
        run: |
          if [ -f audio/manifest.json ]; then
            python3 -c "import json; d=json.load(open('audio/manifest.json')); w=d['words']; t=sum(f['d'] for f in w.values()); print('## Palabras de VOCAB BATTLE\\n\\n- Palabras grabadas: **%d**\\n- Voz: **%s**\\n- Duracion total: **%d min %02d s**' % (len(w), d.get('voice','?'), t//60, t%60))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Palabras de VOCAB BATTLE' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No se grabo ninguna palabra. Revisa el registro del paso anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
